name: PulseNotify checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py test --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Prepare local integration environment
        run: |
          cp .env.example .env
          python -c "from pathlib import Path; import secrets; p=Path('.env'); p.write_text(p.read_text().replace('replace-with-a-generated-random-secret-key', secrets.token_urlsafe(50)).replace('replace-with-a-local-database-password', secrets.token_urlsafe(24)))"
      - run: docker compose up --build -d --wait web worker beat
      - run: docker compose exec -T web python manage.py test
      - run: docker compose exec -T web python manage.py smoke_test
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
